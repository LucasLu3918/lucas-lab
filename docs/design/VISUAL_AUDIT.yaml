findings:
- id: VIS-001
  component: Navigation icons
  route: /
  symptom: Legacy raw SVG became dark/invisible and squeezed search label after CSS
    cleanup
  classification: outlier
  valid_variant: false
  approved_exception: false
  root_cause:
    source: scripts/build.cjs
    style: .icon
    token: null
    mechanism: raw SVG did not inherit the shared dimensions/fill/stroke attributes
  fix: use shared icon(menu) and icon(search); preserve no-wrap search label
  status: closed
- id: VIS-002
  component: Chapter select
  route: /stories/mist-letters/chapters/01/
  symptom: Mobile chapter label wrapped vertically
  classification: outlier
  valid_variant: false
  approved_exception: false
  root_cause:
    source: assets/style.css
    style: .chapter-select
    token: null
    mechanism: anonymous flex text item could shrink and wrap
  fix: 'white-space: nowrap on label group; select retains min-width:0'
  status: closed
