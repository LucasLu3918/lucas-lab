<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" role="img" aria-labelledby="title desc">
<title id="title">白雪公主：血色魔鏡——原創黑暗奇幻封面</title>
<desc id="desc">深藍雪夜中破碎的銀鏡映照著銀眼黑髮女子，紅蘋果漂浮在鏡前，遠方黑色城堡與寒霧。</desc>
<defs>
<linearGradient id="night" x2=".8" y2="1"><stop stop-color="#071322"/><stop offset=".52" stop-color="#131b37"/><stop offset="1" stop-color="#351625"/></linearGradient>
<radialGradient id="cold"><stop stop-color="#d4e6f5" stop-opacity=".7"/><stop offset=".46" stop-color="#8fa8cb" stop-opacity=".2"/><stop offset="1" stop-color="#8fa8cb" stop-opacity="0"/></radialGradient>
<radialGradient id="mirror"><stop stop-color="#c5cad7"/><stop offset=".62" stop-color="#3e5773"/><stop offset="1" stop-color="#111927"/></radialGradient>
<radialGradient id="apple"><stop stop-color="#ff8068"/><stop offset=".33" stop-color="#aa132b"/><stop offset="1" stop-color="#320817"/></radialGradient>
<linearGradient id="silver" x2="1" y2="1"><stop stop-color="#f2f1e3"/><stop offset=".35" stop-color="#90a6be"/><stop offset=".65" stop-color="#edf0ee"/><stop offset="1" stop-color="#41566d"/></linearGradient>
<linearGradient id="gown" x2="1" y2="1"><stop stop-color="#0c1528"/><stop offset="1" stop-color="#461d38"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
