name: Validate LUCAS LAB (Cloudflare Workers)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare-ready static build
        run: npm run check
  live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare production and deployed main commit
        env:
          SITE_URL: https://lucas-lab.owl3918.workers.dev
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run smoke:live
