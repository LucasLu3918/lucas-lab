name: Responsive browser acceptance (Chromium)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install locked project dependencies
        run: npm ci
      - name: Build the static site (unit tests and content checks run in site.yml)
        run: npm run build
      - name: Cache Chromium for Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}
      - name: Install isolated browser testing tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Exercise every Blood Mirror browser scenario (journey, deduction, endings, gallery, media, pipes, replay, solo, stage, UI)
        run: npm run test:game
      - name: Audit responsive layout and interactions
        run: npm run test:visual
      - name: Verify reading, offline, search and CSP behaviour in Chromium
        run: npm run test:site
      - name: Enforce page weight and layout-stability budgets
        run: npm run test:perf
      - name: Preserve representative viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-screenshots
          path: visual-audit-artifacts/
          if-no-files-found: ignore
          retention-days: 14
