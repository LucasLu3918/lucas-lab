<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E5 七重魔鏡匣 原型</title>
<!-- Throwaway prototype (plan-expert-levels.md, E5). Question: does the finale read clearly as six faces that each
     use something earned in E1-E4, and can the zhuyin cipher disc be decoded without outside knowledge?
     Rules and hints live in the data-core block; prototypes/e5-box.solve.cjs extracts it and checks it. Not shipped. -->
<style>
:root{--bg:#0b0710;--gold:#e0b84f;--ink:#e9dcc3;--ok:#6f6;--bad:#f66}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
header{padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header b{color:var(--gold)}
button{background:#241522;color:var(--ink);border:1px solid var(--gold);border-radius:6px;min-height:44px;padding:0 12px;font:inherit;cursor:pointer}
button[aria-pressed=true]{background:#5a3a14}
button:disabled{opacity:.4;cursor:default}
#goal{margin:0 12px 6px;padding:8px 12px;border-left:3px solid var(--gold);background:#1a1022;font-size:15px}
#status{margin:0 12px 6px;min-height:24px;font-weight:600}
#status.ok{color:var(--ok)}#status.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 12px}
#inv{margin:0 12px 8px;padding:8px 12px;border:1px solid #3a2a14;border-radius:8px;background:#120b17;font-size:13px}
#inv .it{display:inline-block;margin:2px 8px 2px 0;padding:2px 8px;border:1px solid #6b5a3a;border-radius:12px}
#inv .it.no{opacity:.35;border-style:dashed}
#sim{margin:0 12px 8px;font-size:12px;color:#9a8c70}
#stage{display:flex;justify-content:center;perspective:700px;height:200px;align-items:center}
#cube{position:relative;width:130px;height:130px;transform-style:preserve-3d;transition:transform .7s}
.face{position:absolute;width:130px;height:130px;border:2px solid var(--gold);border-radius:10px;background:linear-gradient(145deg,#1b1424,#0a0710);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink);backface-visibility:hidden}
.face .g{font-size:34px;line-height:1}
.face.done{border-color:#6f6;box-shadow:0 0 14px #6f66 inset}
.face.lock{opacity:.6}
.face[aria-pressed=true]{outline:2px solid #fff}
.f0{transform:translateZ(65px)}.f1{transform:rotateY(90deg) translateZ(65px)}.f2{transform:rotateY(180deg) translateZ(65px)}
.f3{transform:rotateY(-90deg) translateZ(65px)}.f4{transform:rotateX(90deg) translateZ(65px)}.f5{transform:rotateX(-90deg) translateZ(65px)}
.v0{transform:rotateX(0) rotateY(0)}.v1{transform:rotateY(-90deg)}.v2{transform:rotateY(-180deg)}.v3{transform:rotateY(90deg)}.v4{transform:rotateX(-90deg)}.v5{transform:rotateX(90deg)}
#panel{margin:8px 12px;padding:10px 12px;border:1px solid #3a2a14;border-radius:8px;background:#120b17}
#hinttext{margin:0 12px 8px;padding:6px 12px;border-left:3px solid #7fe;background:#10202a;display:none}
.cols{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.dot{min-width:44px}
.slot{width:60px;height:60px;border:2px dashed #6b5a3a;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:3px;background:#0b0710;color:#cdbf9f;cursor:pointer;font:inherit}
.slot.on{border-style:solid;border-color:var(--gold);color:var(--gold);font-weight:700}
.zy{font-size:22px;display:inline-block;min-width:1.4em;text-align:center}
table.zt{border-collapse:collapse;font-size:12px;margin:6px 0}
table.zt td{border:1px solid #3a2a14;padding:1px 4px;text-align:center}
table.zt td b{display:block;font-size:15px}
.letter{display:grid;grid-template-columns:auto auto auto auto;gap:8px;align-items:center;margin:6px 0}
.big{font-size:26px;min-width:1.6em;text-align:center;padding:2px 8px;border:1px solid #6b5a3a;border-radius:8px}
</style>
</head>
<body>
<header>
  <b>E5 七重魔鏡匣 · 原型</b>
  <button id="prev" aria-label="上一面">◀</button><button id="next" aria-label="下一面">▶</button>
  <button id="reset">重來</button>
</header>
<p id="goal">魔鏡匣有六面，每一面都要用前面關卡取得的東西打開。點匣子的任一面，或用 ◀ ▶ 轉動，再照下方的說明操作。六面都打開，匣子就會開啟。卡住時按「燭光提示」。</p>
<div id="inv"></div>
<div id="sim">試玩用：<span id="simctl"></span></div>
<div id="stage"><div id="cube" class="v0"></div></div>
<div id="status" role="status"></div>
<div id="panel"></div>
<div class="row"><button id="hint">燭光提示</button><button id="skip" style="display:none">略過這一面（放棄完整結局）</button><span id="hintinfo" style="color:#cdbf9f;font-size:12px"></span></div>
<p id="hinttext" role="status"></p>
<script data-core>
// E5 master mirror box rules: six faces, each opened with something from E1-E4 or the main story.
const ZHUYIN37=['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ','ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ','ㄧ','ㄨ','ㄩ'];
// What each earlier level hands over: an item and one zhuyin symbol (the cipher key letter, in level order).
const ITEMS={
 ring:{name:'時辰環',from:'E1',key:'ㄎ',note:'第十三聲鐘響，鐘盤要停在第 13 格。'},
 prism:{name:'稜鏡',from:'E2',key:'ㄒ',note:'透過稜鏡才看得到面上隱藏的刻線。'},
 antidote:{name:'解藥',from:'E3',key:'ㄋ',note:'毒蘋果在提米手上，他是第 7 位。'},
 thread:{name:'紅線',from:'E4',key:'ㄧ',note:'紅線依序穿過：星、月、燈、門。'}
};
const KEY_ORDER=['ring','prism','antidote','thread'];
const PLAIN='ㄌㄨㄒㄧ'; // 露西 without tones: what the cipher disc must spell
const idx=s=>ZHUYIN37.indexOf(s)+1;                       // 1-based position in the standard order
const shift=(c,k,dir)=>ZHUYIN37[(((idx(c)-1+dir*idx(k))%37)+37)%37];
const encrypt=(plain,keys)=>[...plain].map((p,i)=>shift(p,keys[i%keys.length],1)).join('');
const decrypt=(cipher,keys)=>[...cipher].map((c,i)=>shift(c,keys[i%keys.length],-1)).join('');
const KEYS=KEY_ORDER.map(k=>ITEMS[k].key);
const CIPHER=encrypt(PLAIN,KEYS);
// Face solutions
const LIGHT=['R','B','G'];           // engraved line revealed by the prism: red, blue, green
const THREAD=['星','月','燈','門'];     // the order the red thread passes
const APPLE=7;                       // the poisoned miner's number
const TIME=13;
const FACES=[
 {id:'time',name:'時辰面',needs:'ring',glyph:'⌚'},
 {id:'light',name:'光之面',needs:'prism',glyph:'✦'},
 {id:'apple',name:'蘋果鎖',needs:'antidote',glyph:'●'},
 {id:'thread',name:'鏡中鏡',needs:'thread',glyph:'∞'},
 {id:'shards',name:'碎片面',needs:null,glyph:'◆'},
 {id:'cipher',name:'密碼盤',needs:'all4',glyph:'㊙'}
];
const owns=(inv,need)=>!need||(need==='all4'?KEY_ORDER.every(k=>inv.items[k]):!!inv.items[need]);
// A face is opened when its answer is right. Shards: every collected shard is in its own slot.
const HINTS={
 time:['這一面有一個 13 格的撥盤。想想哪一聲鐘響是這座學院多出來的。','第十三聲鐘響是多出來的那一聲。','把撥盤轉到第 13 格。'],
 light:['面上有一條看不見的刻線。舉起稜鏡看看。','刻線是三種顏色的順序，依序按下三個顏色鈕。','紅 → 藍 → 綠。'],
 apple:['蘋果鎖要注入解藥，但要選對那一顆蘋果。','毒蘋果在哪位礦工手上？物品欄的 E3 線索寫著他的編號。','選第 7 顆蘋果。'],
 thread:['紅線要穿過四個孔，順序不能錯。','E4 的線索寫了紅線經過的四樣東西，依那個順序點孔。','星 → 月 → 燈 → 門。'],
 shards:['七個孩子各有一個位置，碎片上刻著編號。','把每片碎片放進和它編號相同的位置。','碎片 n 放進第 n 個位置。'],
 cipher:['這是一組移位密碼：下面的密文符號，要依序用你取得的四個鑰匙符號各移回去一次。','每個鑰匙符號在注音順序表上有編號（ㄅ＝1 … ㄩ＝37）。把密文符號往回數那麼多格，就是明文。','第 1 個字用 E1 的鑰匙，第 2 個用 E2，第 3 個用 E3，第 4 個用 E4。答案是「'+PLAIN+'」。']
};
if(typeof module!=='undefined')module.exports={ZHUYIN37,ITEMS,KEY_ORDER,PLAIN,idx,shift,encrypt,decrypt,KEYS,CIPHER,LIGHT,THREAD,APPLE,TIME,FACES,owns,HINTS};

</script>
<script>
'use strict';
const $=s=>document.querySelector(s);
let inv,cur=0,done,skipped,hintTier,hintsUsed=0,lastChange=Date.now(),seq,sel=null,placed,offsets,prismOn,dial;
const status=(t,c)=>{$('#status').textContent=t;$('#status').className=c||'';};
function reset(){
 inv=inv||{items:{ring:true,prism:true,antidote:true,thread:true},shards:7};
 done={};skipped={};hintTier={};seq=[];sel=null;placed={};offsets=[0,0,0,0];prismOn=false;dial=1;cur=0;
 buildCube();renderAll();status('','');
}
function buildCube(){
 $('#cube').innerHTML=FACES.map((f,i)=>`<button class="face f${i}" data-f="${i}" aria-label="${f.name}"><span class="g">${f.glyph}</span><b>${f.name}</b><span class="st"></span></button>`).join('');
 document.querySelectorAll('.face').forEach(b=>b.onclick=()=>{cur=+b.dataset.f;renderAll();});
}
function faceState(i){const f=FACES[i];return done[f.id]?'done':skipped[f.id]?'skip':owns(inv,f.needs)?'open':'lock';}
function renderAll(){
 $('#cube').className='v'+cur;
 document.querySelectorAll('.face').forEach((b,i)=>{const s=faceState(i);b.className='face f'+i+(s==='done'||s==='skip'?' done':s==='lock'?' lock':'');b.setAttribute('aria-pressed',String(i===cur));b.querySelector('.st').textContent=s==='done'?'✓ 已開啟':s==='skip'?'已略過':s==='lock'?'🔒 缺道具':'';});
 $('#inv').innerHTML='<b>物品欄：</b>'+KEY_ORDER.map(k=>`<span class="it${inv.items[k]?'':' no'}">${ITEMS[k].from}｜${ITEMS[k].name}${inv.items[k]?'（鑰匙符號 '+ITEMS[k].key+'）':''}</span>`).join('')+`<span class="it${inv.shards?'':' no'}">鏡之碎片 ${inv.shards} / 7</span>`+
  KEY_ORDER.filter(k=>inv.items[k]).map(k=>`<div style="font-size:12px;color:#cdbf9f">・${ITEMS[k].from} ${ITEMS[k].note}</div>`).join('');
 $('#simctl').innerHTML=KEY_ORDER.map(k=>`<label style="margin-right:8px"><input type="checkbox" data-k="${k}" ${inv.items[k]?'checked':''}> ${ITEMS[k].name}</label>`).join('')+`碎片 <select id="shardsel">${[0,1,2,3,4,5,6,7].map(n=>`<option${n===inv.shards?' selected':''}>${n}</option>`).join('')}</select>`;
 document.querySelectorAll('#simctl input').forEach(c=>c.onchange=()=>{inv.items[c.dataset.k]=c.checked;renderAll();});
 $('#shardsel').onchange=e=>{inv.shards=+e.target.value;placed={};renderAll();};
 renderPanel();updateHint();checkBox();
}
function solve(id){if(done[id])return;done[id]=true;lastChange=Date.now();renderAll();}
function renderPanel(){
 const f=FACES[cur],p=$('#panel'),st=faceState(cur);
 const head=`<b>${f.glyph} ${f.name}</b>　`;
 if(st==='done'){p.innerHTML=head+'已經打開。';return;}
 if(st==='skip'){p.innerHTML=head+'已略過。';return;}
 if(st==='lock'){const miss=f.needs==='all4'?KEY_ORDER.filter(k=>!inv.items[k]).map(k=>ITEMS[k].name+'（'+ITEMS[k].from+'）').join('、'):ITEMS[f.needs].name+'（'+ITEMS[f.needs].from+'）';p.innerHTML=head+`這一面還打不開，需要：${miss}。`;return;}
 ({time:pTime,light:pLight,apple:pApple,thread:pThread,shards:pShards,cipher:pCipher})[f.id](p,head);
}
function pTime(p,head){
 p.innerHTML=head+`用時辰環轉動撥盤，把它停在對的那一格。<div class="cols"><button id="dm" aria-label="減一格">−</button><span class="big" id="dv">${dial}</span><button id="dp" aria-label="加一格">＋</button></div>`;
 const set=n=>{dial=Math.max(1,Math.min(13,n));$('#dv').textContent=dial;lastChange=Date.now();if(dial===TIME){status('撥盤咔的一聲停在第 13 格。','ok');solve('time');}else status('撥盤停在第 '+dial+' 格，什麼也沒發生。','');};
 $('#dm').onclick=()=>set(dial-1);$('#dp').onclick=()=>set(dial+1);
}
const SHAPE={R:['▲','紅'],G:['●','綠'],B:['■','藍']},COLOR={R:'#ff6b6b',G:'#6bff95',B:'#6b9cff'};
function pLight(p,head){
 p.innerHTML=head+`<button id="pr" aria-pressed="${prismOn}">${prismOn?'放下稜鏡':'舉起稜鏡'}</button><div id="eng" style="margin:8px 0;min-height:30px">${prismOn?'刻線浮現：'+LIGHT.map(c=>`<span style="color:${COLOR[c]};font-size:24px;margin-right:6px">${SHAPE[c][0]}</span>`).join(''):'<span style="color:#6b5a3a">（面上什麼也看不到）</span>'}</div>
  <div>依刻線的順序按下三個顏色鈕：<span id="seq" style="color:#cdbf9f">（已按 ${seq.length} 個）</span></div><div class="cols">${['R','G','B'].map(c=>`<button class="dot" data-c="${c}" style="color:${COLOR[c]}">${SHAPE[c][0]} ${SHAPE[c][1]}</button>`).join('')}</div>`;
 $('#pr').onclick=()=>{prismOn=!prismOn;renderPanel();};
 p.querySelectorAll('.dot').forEach(b=>b.onclick=()=>pushSeq(b.dataset.c,LIGHT,'light'));
}
function pushSeq(v,answer,id){
 seq.push(v);lastChange=Date.now();const k=seq.length-1;
 if(seq[k]!==answer[k]){status(`第 ${k+1} 個不對，重新來。`,'bad');seq=[];renderPanel();return;}
 if(seq.length===answer.length){status('順序正確。','ok');seq=[];solve(id);return;}
 status(`已按 ${seq.length} 個。`,'');const s=$('#seq');if(s)s.textContent=`（已按 ${seq.length} 個）`;
}
function pApple(p,head){
 p.innerHTML=head+`解藥要注入其中一顆小蘋果。選哪一顆？<div class="cols">${[1,2,3,4,5,6,7].map(n=>`<button class="slot" data-n="${n}" aria-label="蘋果 ${n}">${n}</button>`).join('')}</div>`;
 p.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{lastChange=Date.now();if(+b.dataset.n===APPLE){status('解藥滲入第 7 顆蘋果，鎖開了。','ok');solve('apple');}else status(`第 ${b.dataset.n} 顆沒有反應。`,'bad');});
}
function pThread(p,head){
 const holes=['門','星','燈','月']; // shown scrambled so position gives nothing away
 p.innerHTML=head+`用紅線依序穿過四個孔。<span id="seq" style="color:#cdbf9f">（已穿 ${seq.length} 個）</span><div class="cols">${holes.map(h=>`<button class="slot" data-h="${h}" style="font-size:20px">${h}</button>`).join('')}</div>`;
 p.querySelectorAll('.slot').forEach(b=>b.onclick=()=>pushSeq(b.dataset.h,THREAD,'thread'));
}
function pShards(p,head){
 const n=inv.shards,tray=[...Array(n).keys()].map(i=>i+1).filter(i=>!placed[i]);
 p.innerHTML=head+`七個孩子各有一個位置。碎片上刻著編號：先點一片碎片，再點位置。${n<7?`<br><span style="color:#cdbf9f">你只收集了 ${n} 片，沒收集的位置會留空（完整結局需要 7 片）。</span>`:''}
  <div class="cols" id="tray">${tray.map(i=>`<button class="slot${sel===i?' on':''}" data-s="${i}" aria-label="碎片 ${i}">◆${i}</button>`).join('')||'<span style="color:#cdbf9f">（碎片都放好了）</span>'}</div>
  <div class="cols">${[1,2,3,4,5,6,7].map(i=>`<button class="slot${placed[i]?' on':''}" data-p="${i}" aria-label="位置 ${i}">${placed[i]?'◆'+i:'位置 '+i}</button>`).join('')}</div>`;
 p.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sel=sel===+b.dataset.s?null:+b.dataset.s;renderPanel();});
 p.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.p;if(sel===null){status('先選一片碎片。','');return;}lastChange=Date.now();
  if(sel!==i){status(`碎片 ${sel} 放不進位置 ${i}（編號要對上）。`,'bad');return;}
  placed[i]=true;sel=null;status(`碎片 ${i} 嵌進去了。`,'ok');
  if(Object.keys(placed).length===inv.shards)solve('shards');else renderPanel();
 });
 if(inv.shards===0&&!done.shards){p.insertAdjacentHTML('beforeend','<div style="margin-top:6px">沒有碎片可放，這一面直接略過（縮減結局）。</div>');}
}
function pCipher(p,head){
 const rows=[0,1,2,3].map(i=>{const out=shift(CIPHER[i],'ㄅ',1);return i;});
 const plain=[...CIPHER].map((c,i)=>ZHUYIN37[(((idx(c)-1-offsets[i])%37)+37)%37]).join('');
 p.innerHTML=head+`王后留下四個符號的密文。每個符號要用<b>對應關卡的鑰匙符號</b>往回數：鑰匙符號在下表的編號是幾，就往回數幾格。
  <table class="zt"><tr>${ZHUYIN37.slice(0,19).map((z,i)=>`<td><b>${z}</b>${i+1}</td>`).join('')}</tr><tr>${ZHUYIN37.slice(19).map((z,i)=>`<td><b>${z}</b>${i+20}</td>`).join('')}</tr></table>
  ${[0,1,2,3].map(i=>`<div class="letter"><span class="big">${CIPHER[i]}</span><span>往回數 <button data-o="${i}" data-s="-5" aria-label="第 ${i+1} 個減五">−5</button><button data-o="${i}" data-s="-1" aria-label="第 ${i+1} 個減一">−1</button> <b id="o${i}">${offsets[i]}</b> <button data-o="${i}" data-s="1" aria-label="第 ${i+1} 個加一">＋1</button><button data-o="${i}" data-s="5" aria-label="第 ${i+1} 個加五">＋5</button> 格 →</span><span class="big" id="r${i}">${ZHUYIN37[(((idx(CIPHER[i])-1-offsets[i])%37)+37)%37]}</span><span style="font-size:12px;color:#cdbf9f">第 ${i+1} 個用 ${ITEMS[KEY_ORDER[i]].from} 的鑰匙</span></div>`).join('')}
  <div>目前讀出：<b class="zy" id="word">${plain}</b></div>`;
 p.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.o;offsets[i]=(offsets[i]+(+b.dataset.s)+37)%37;lastChange=Date.now();
  const w=[...CIPHER].map((c,j)=>ZHUYIN37[(((idx(c)-1-offsets[j])%37)+37)%37]).join('');
  $('#o'+i).textContent=offsets[i];$('#r'+i).textContent=w[i];$('#word').textContent=w;
  if(w===PLAIN){status('四個符號拼成「'+PLAIN+'」—露西。盤面鬆開了。','ok');solve('cipher');}else status('','');
 });
}
function checkBox(){
 const all=FACES.every(f=>done[f.id]||skipped[f.id]);
 if(!all)return;
 const sk=FACES.filter(f=>skipped[f.id]).length,full=sk===0&&inv.shards===7;
 status(full?'六面全部打開：魔鏡匣開啟。進入完整的「鏡之背面」。':`匣子開啟（略過 ${sk} 面、碎片 ${inv.shards}/7）：進入縮減版的「鏡之背面」。`,'ok');
}
function updateHint(){
 const f=FACES[cur],t=hintTier[f.id]||0,st=faceState(cur);
 $('#skip').style.display=(st==='open'||st==='lock')&&t>=3?'':'none';
 if(st==='done'||st==='skip'||st==='lock'&&t===0)$('#hinttext').style.display='none';
}
function showHint(auto){
 const f=FACES[cur],st=faceState(cur);if(st==='done'||st==='skip')return;
 hintTier[f.id]=Math.min((hintTier[f.id]||0)+1,3);if(!auto)hintsUsed++;
 const t=hintTier[f.id];$('#hinttext').style.display='block';
 $('#hinttext').textContent=(auto?'魔鏡低語：':f.name+'・燭光提示 '+t+' / 3：')+(st==='lock'?`這一面需要「${f.needs==='all4'?'四個鑰匙符號':ITEMS[f.needs].name}」，要回到${f.needs==='all4'?' E1–E4':' '+ITEMS[f.needs].from}取得。`:HINTS[f.id][t-1]);
