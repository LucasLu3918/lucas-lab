<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E1 星輪 原型</title>
<!-- Prototype generated by build-belfry-prototypes.cjs from the shipped modules (puzzles/starwheel.js). Not shipped. -->
<style>:root{--serif:"Noto Serif TC","Songti TC",Georgia,serif;--sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif;--gold:#c3ac80;--line:rgba(195,172,128,.19)}*{box-sizing:border-box}body{margin:0;background:#100f10;color:#eee5d6;font:14px/1.8 var(--sans)}button{min-height:44px;font:inherit;cursor:pointer;color:inherit;border:0;background:none}#modal{max-width:640px;margin:16px auto;padding:24px 32px;border:1px solid #bc9f6740;border-radius:12px;background:#191619}.secondary-button{border:1px solid var(--line);padding:12px;color:var(--gold)}.primary-button{background:#8d2d3b;border:1px solid #ac4e4b66;color:#f4e9dc;padding:12px 24px;width:100%;margin-top:12px}.modal-text,h2{font-family:var(--serif)}#proto-done{display:none;padding:16px;border:1px solid #7fd08a;color:#bfeac5;margin-top:12px}/* Responsive, low-latency tactile puzzle interface */
.challenge{color:#e8ddcc;padding:4px 0 10px}
.challenge-help{font-size:14px;line-height:1.9;color:#c6b5a0;margin:0 0 17px}
.challenge-feedback{min-height:26px;font-size:12px;letter-spacing:.4px;color:#d8be8f}
.challenge button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tile-board,.pipes-board,.reflection-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:min(100%,385px);margin:12px auto 16px;padding:7px;background:#070709;border:1px solid #b59c6c88;border-radius:3px;box-shadow:0 12px 38px #0007}
.tile-board{aspect-ratio:1}.picture-tile{background-size:300% 300%;background-repeat:no-repeat;aspect-ratio:1;border:2px solid #b49a6655;border-radius:1px;min-width:0;transition:border-color .08s,filter .08s;filter:sepia(.18)}
.picture-tile.selected{border:2px solid #eed8a3;filter:brightness(1.3);z-index:2;box-shadow:inset 0 0 12px #eed8a35a}
.picture-tile:active{filter:brightness(1.35)}
.pipes-board{aspect-ratio:1;width:min(100%,385px);padding:2px;gap:2px;background:#6e573d;border:1px solid #b59c6c88}
.pipe-empty,.pipe-piece,.pipe-terminal{min-height:0;min-width:0;aspect-ratio:1;display:grid;place-items:center;padding:0;border:1px solid transparent;background:radial-gradient(ellipse,#3c2b21,#151116);color:#d1ac71;line-height:1;position:relative}
.pipe-empty{font-size:12px;color:#aa9683;background:repeating-linear-gradient(135deg,#171419,#171419 9px,#211c22 9px,#211c22 18px)}.pipe-piece{overflow:hidden;border-radius:0}
.pipe-coordinate{font:10px Georgia,serif;position:absolute;left:5px;top:5px;color:#c9b795;z-index:2}.pipe-glyph{display:block;width:100%;height:100%;transition:transform .12s ease-out;transform-origin:50% 50%;transform-box:view-box;pointer-events:none}.pipe-shadow{stroke:#08070a;stroke-width:24}.pipe-metal{stroke:#ac7848;stroke-width:16}.pipe-core{stroke:#ddb57c;stroke-width:5}.flowing .pipe-metal{stroke:#c3a866}.flowing .pipe-core{stroke:#b9eeed;stroke-width:6;filter:drop-shadow(0 0 3px #69d4d0)}.pipe-terminal-mark{fill:#171318;stroke:#d2b77f;stroke-width:3}.flowing .pipe-terminal-mark{fill:#336365}.pipe-terminal strong{position:absolute;top:7px;left:7px;font-size:13px;color:#edd9b7}.pipe-terminal-status{position:absolute;bottom:7px;left:7px;font-size:10px;color:#cfb994}.pipe-connected{position:absolute;right:4px;bottom:5px;color:#b9eeed;font-size:10px;padding:2px 3px;background:#132328e8}.pipe-connected[hidden]{display:none}.pipe-piece:focus-visible{outline:3px solid #f0d49e;outline-offset:-4px;z-index:2}.pipe-piece:hover{background:#463127}.pipe-legend{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#c6b5a0}.pipe-legend span:first-child{color:#b9eeed}.pipe-explanation,.pipe-keyboard,.pipe-hint{font-size:12px;color:#c6b5a0;line-height:1.9}.pipe-keyboard{color:#aa9d8e}.pipe-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pipe-actions .secondary-button{font-size:12px;letter-spacing:0;padding:10px 5px}.pipe-hint:empty{display:none}
.rune-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px auto;max-width:440px}
.rune-key{aspect-ratio:1;min-height:56px;border:1px solid #ad8e6570;background:#201a22;display:grid;place-items:center;color:#c1a982;font-size:38px;transition:background .08s,box-shadow .08s}
.rune-key.illuminated{background:#a65360;box-shadow:0 0 30px #cf758999;color:#fff;border-color:#ffc9d4}
.memory-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px auto;max-width:440px}
.memory-card{min-height:75px;aspect-ratio:4/5;border:1px solid #9f8c6744;background:linear-gradient(150deg,#31222d,#100e13);font:33px Georgia,serif;color:#86705f;display:grid;place-items:center}
.memory-card.turned{color:#f7dab0;border-color:#c49d6d;background:#46313f}
.memory-card.memory-note{padding:6px;place-items:center}
.memory-text{font-size:13px;line-height:1.55;color:#f7dab0;text-align:center}
.stage-picks{display:grid;gap:10px;margin:6px 0 14px}
.stage-switch{margin-top:10px}
.stage-hints{margin-top:16px;border-top:1px solid #9f8c6733;padding-top:10px}
.stage-hints summary{cursor:pointer;color:#d8be8f;font-size:13px;letter-spacing:.4px;min-height:44px;display:flex;align-items:center}
.stage-hints .hint-step{margin:8px 0}
.reflection-board{grid-template-columns:repeat(4,minmax(0,1fr));max-width:440px}
.reflection-cell{min-height:66px;aspect-ratio:1;background:#140e18;color:#796578;font-size:29px;border:1px solid #72506877}
.reflection-cell.glow{background:radial-gradient(ellipse,#75465d,#2c2131 80%);color:#ffd0d4;text-shadow:0 0 14px #eaa4c5}
.reflection-cell.fixed{border-color:#d9b67b88;background-color:#2c2123;opacity:1;cursor:default}
.reflection-cell:disabled{opacity:1}
#modal .challenge .secondary-button,#modal .challenge .primary-button{min-height:46px;margin-top:7px}
.ending-art{background-size:cover;background-position:center 37%;background-repeat:no-repeat}
.hotspot{touch-action:manipulation}
.hotspot:active{background:#754950;box-shadow:0 0 0 10px #c3ac8033}
@media (max-width:640px){
 .challenge-help{font-size:14px}
 .tile-board,.pipes-board,.reflection-board{width:min(100%,315px)}
 .pipe-terminal strong{font-size:12px}.pipe-actions{gap:6px}.pipe-actions .secondary-button{font-size:11px}
 .rune-key{min-height:56px;font-size:29px}
 /* Four columns leave a phone card ~60px wide: the memory text and object label clip or overlap. Two columns give
    each card room for its object and its line of testimony. */
 .memory-board{grid-template-columns:repeat(2,minmax(0,1fr));max-width:320px}
 .memory-card{aspect-ratio:1/1;min-height:0;font-size:26px}
 .memory-text{font-size:13px;line-height:1.5}
 .reflection-cell{min-height:55px}
 .ending-art{background-position:center 30%}
}
@media(prefers-reduced-motion:reduce){
 .pipe-glyph,.picture-tile,.rune-key{transition:none}
}
/* Preserve WCAG contrast in the game footer on dark backgrounds. */
footer>span:nth-child(2){color:#b9ada2}

/* Hotspots must win hit testing over the scene image at all viewport sizes. */
.scene>img{position:absolute;inset:0;z-index:0;pointer-events:none}
.scene-shade{z-index:1}
.scene-caption{z-index:2}
#hotspots{position:absolute;inset:0;z-index:50;pointer-events:auto}
#hotspots .hotspot{pointer-events:auto;z-index:51}
/* Black Bell Archive: torn birth record (typeset SVG, see ledger.js) */
.ledger{display:block;width:100%;height:100%}
.ledger-tile{padding:0;background:#d6c39b;overflow:hidden;filter:none}
.ledger-tile.placed{border-color:#d9bf8a99}
.ledger-tile.selected{filter:brightness(1.12)}
.ledger-paper{fill:#d8c59c}
.ledger-stain{fill:#8a6a3a;opacity:.13}
.ledger-frame{fill:none;stroke:#5b4128;stroke-width:2}
.ledger-frame.thin{stroke-width:.8;opacity:.7}
.ledger-rule{stroke:#5b4128;stroke-width:.8;opacity:.6}
.ledger text{font-family:var(--serif);fill:#2e2016}
.ledger-title{font-size:23px;font-weight:700;letter-spacing:3px}
.ledger-small{font-size:12px;letter-spacing:1px}
.ledger-line{font-size:17px;letter-spacing:2px}
.ledger .ledger-number{font-size:34px;font-weight:700;fill:#7a1f28;letter-spacing:2px}
.ledger-mark{font-size:11px;opacity:.75}
.ledger-blot{fill:#140d0b;opacity:.88}
.ledger-seal{fill:#7a1f28}
.ledger .ledger-seal-mark{fill:#e9c9a6;font-size:20px}
.ledger-figure{width:min(100%,300px);margin:4px auto 14px;border:1px solid #b59c6c88;box-shadow:0 12px 38px #0007}
.rune-carving{margin:4px 0 12px;padding:8px 12px;border:1px dashed #b59c6c88;color:#e7d6b3;text-align:center;letter-spacing:1px}
.memory-fragments{margin:6px 0 0;padding-left:20px;color:#e7d6b3;line-height:1.7}

/* Chapter puzzles added in M6: masked guests and the glass-heart ring */
.mask-clues{margin:0 0 16px;padding-left:20px;color:#c6b5a0;font-size:13px;line-height:1.9}
.mask-board{display:grid;gap:8px;margin:0 0 14px}
.mask-row{display:grid;grid-template-columns:28px 64px 1fr;align-items:center;gap:10px;min-height:44px}
.mask-slot{font:12px Georgia,serif;color:#a99876;text-align:center}.mask-name{color:#d8be8f;font-size:14px}
.mask-row select{min-height:44px;width:100%;background:#201a22;color:#e8ddcc;border:1px solid #ad8e6570;padding:0 10px;font:inherit}
.heart-ring{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,66px);justify-items:center;align-items:center;width:min(100%,330px);margin:12px auto 8px}
.heart-node{width:56px;height:56px;min-height:44px;border-radius:50%;border:1px solid #ad8e6570;background:#201a22;color:#c1a982;font-size:22px;display:grid;place-items:center;transition:background .08s,box-shadow .08s}
.heart-node.lit{background:#a65360;color:#fff;border-color:#ffc9d4;box-shadow:0 0 22px #cf758999}
.heart-core{grid-column:2/5;grid-row:2/4;font:13px Georgia,serif;color:#d8be8f;opacity:.85;text-align:center}
/* Seven runes laid out as a ring on a 5x4 grid, clockwise from the top. */
.heart-node.n0{grid-column:3;grid-row:1}.heart-node.n1{grid-column:5;grid-row:2}.heart-node.n2{grid-column:5;grid-row:3}.heart-node.n3{grid-column:4;grid-row:4}
.heart-node.n4{grid-column:2;grid-row:4}.heart-node.n5{grid-column:1;grid-row:3}.heart-node.n6{grid-column:1;grid-row:2}
@media (prefers-reduced-motion:reduce){.heart-node{transition:none}}

/* Mirror light path (second stage of the ballroom evidence) */
.light-board{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;width:min(100%,360px);margin:12px auto 10px;padding:6px;background:#070709;border:1px solid #b49a6655}
.light-cell{aspect-ratio:1;min-height:44px;display:grid;place-items:center;background:#15111a;border:1px solid #2b2430;color:#6c5d49;font-size:20px}
.light-cell.beam{background:#2a2430;border-color:#6d7f96;color:#c9dcef;box-shadow:inset 0 0 14px #9fb6c855}
.light-mirror{background:#201a22;border-color:#ad8e6570;color:#d8be8f;font-size:28px;font-family:Georgia,serif}
.light-mirror.beam{background:#33404f;border-color:#9fb6c8;color:#fff}
.light-door{border-color:#a65360;color:#a65360}.light-door.open{background:#a65360;color:#fff;box-shadow:0 0 18px #cf758999}

/* Character portraits: painted half-body figures fade into the dialog */
.modal-portrait{display:block;margin:0 auto 14px;width:min(100%,240px);height:auto;aspect-ratio:320/468;object-fit:cover;object-position:top;border:1px solid #ad8e6540;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}

/* Second-stage mechanisms: watch gears, bed names, coffin rubbing, rabbit-ear stitches, mirror corridor */
.watch-board{display:flex;justify-content:center;margin:16px auto 12px;padding:16px 24px 10px;width:fit-content;max-width:100%;border-radius:56px;border:2px solid #b99a62;background:radial-gradient(ellipse at 50% 20%,#2e2418,#130e0b 72%);box-shadow:inset 0 0 28px #000c,0 0 0 4px #17110c,0 0 0 5px #b99a6266,0 14px 36px #0008}
.watch-gear{width:92px;min-height:44px;margin:0 -9px;padding:0;border:0;background:none;color:#e8d3a2;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-family:Georgia,serif;cursor:pointer}
.watch-gear:focus-visible{outline:2px solid #f0dca8;outline-offset:2px}
.watch-gear:nth-child(2){z-index:1}
.gear-spin{flex:none;display:block;width:92px;height:92px;transition:transform .42s cubic-bezier(.3,1.45,.5,1)}
.gear-svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 3px #000a)}
.gear-teeth{fill:#7d6236;stroke:#d9bd82;stroke-width:1.2;stroke-linejoin:round}
.gear-rim{fill:#2a2015;stroke:#b99a62;stroke-width:2}
.gear-spokes{stroke:#9a7d48;stroke-width:3.2;stroke-linecap:round}
.gear-hub{fill:#5c4627;stroke:#d9bd82;stroke-width:1.5}
.gear-pin{fill:#e8d3a2}
.gear-ruby{fill:#6d2530;stroke:#c3ac80;stroke-width:1.4;transition:fill .2s,filter .2s}
.watch-gear.aligned .gear-ruby{fill:#ff5c70;filter:drop-shadow(0 0 5px #ff5c70)}
.watch-gear.aligned .gear-teeth{stroke:#f3e1ae}
.watch-gear:active .gear-svg{filter:drop-shadow(0 2px 3px #000a) brightness(1.2)}
.watch-name{font-size:12px;letter-spacing:2px;color:#f0dca8;pointer-events:none}
.rub-board{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:min(100%,340px);margin:12px auto}
.rub-cell{aspect-ratio:1;min-height:44px;background:#0d0b0e;border:1px solid #2b2430;color:#d8be8f;font:22px Georgia,'Noto Serif TC',serif;touch-action:none}
.rub-cell.clear{background:#2a2430;border-color:#ad8e6580}
.seal-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 12px}
.seal-choice{min-height:44px;background:#201a22;color:#e8ddcc;border:1px solid #ad8e6570;font:20px Georgia,'Noto Serif TC',serif}
.stitch-pair{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:12px 0}
.stitch-caption{margin:0 0 6px;font-size:12px;color:#a99876;text-align:center}
.stitch-board{display:grid;grid-template-columns:repeat(4,44px);gap:3px;padding:5px;background:#070709;border:1px solid #b49a6655}
.stitch-cell{width:44px;height:44px;display:grid;place-items:center;background:#15111a;border:1px solid #2b2430;color:#d8be8f;font:15px Georgia,serif}
.stitch-cell.on{background:#4a2630;border-color:#a65360;color:#fff}
.maze-board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:min(100%,360px);margin:12px auto 8px;padding:6px;background:#070709;border:1px solid #b49a6655}
.maze-cell{aspect-ratio:1;min-height:0;display:grid;place-items:center;background:#15111a;border:1px solid #2b2430;color:#6c5d49}
.maze-cell.wall{background:#3b4656;border-color:#9fb6c8;opacity:.8}
.maze-cell.gate{background:#2a1e2c;border-color:#c49d6d;color:#e2c48e;font-size:18px}
.maze-cell.exit{border-color:#a65360;color:#cf7589;font-size:20px}
.maze-cell.here{background:#33404f;border-color:#9fb6c8;color:#fff;font-size:22px}
.maze-pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-areas:'. u .' 'l d r';gap:6px;justify-content:center;margin:6px 0 10px}
.maze-key{min-width:52px;min-height:52px;background:#201a22;color:#d8be8f;border:1px solid #ad8e6570;font-size:18px}
.maze-U{grid-area:u}.maze-L{grid-area:l}.maze-D{grid-area:d}.maze-R{grid-area:r}
@media (prefers-reduced-motion:reduce){.gear-spin,.gear-ruby{transition:none}}

/* Brass finish for every mechanism and dialog control (concept boards: gilded, riveted, hand-made).
   One token set, loaded after challenges.css so it restyles the puzzle parts without touching their markup.
   Shapes use gradients and box-shadow only: no image files, nothing that needs 'unsafe-inline'. */
#modal{
 --brass-hi:#f0dca8;--brass:#c9ab6a;--brass-mid:#9a7d48;--brass-lo:#5c4627;--brass-ink:#17110c;
 --ruby:#b8323f;--ruby-hi:#ff7385;
 --bevel:inset 0 1px 0 #f0dca83d,inset 0 -2px 0 #0009,0 2px 0 #000a;
}

/* Boards sit in a riveted brass plate. */
#modal :is(.tile-board,.reflection-board,.light-board,.stitch-board,.maze-board,.rub-board,.rune-board,.memory-board,.heart-ring){
 background:
  radial-gradient(circle,#f3e1ae 0 1.5px,#8a6d3a 2px,transparent 3px) 4px 4px/9px 9px no-repeat,
  radial-gradient(circle,#f3e1ae 0 1.5px,#8a6d3a 2px,transparent 3px) calc(100% - 4px) 4px/9px 9px no-repeat,
  radial-gradient(circle,#f3e1ae 0 1.5px,#8a6d3a 2px,transparent 3px) 4px calc(100% - 4px)/9px 9px no-repeat,
  radial-gradient(circle,#f3e1ae 0 1.5px,#8a6d3a 2px,transparent 3px) calc(100% - 4px) calc(100% - 4px)/9px 9px no-repeat,
  radial-gradient(ellipse at 50% 0,#2b2117,#0f0a08 78%);
 border:2px solid var(--brass);border-radius:8px;
 box-shadow:inset 0 0 0 2px #0b0806,inset 0 0 0 3px #c9ab6a4d,inset 0 0 26px #000c,0 0 0 3px #17110c,0 0 0 4px #c9ab6a40,0 14px 36px #000a;
}
#modal :is(.rune-board,.memory-board,.heart-ring){padding:14px;box-sizing:border-box}
#modal .pipes-board{border:2px solid var(--brass);border-radius:8px;box-shadow:inset 0 0 0 2px #0b0806,0 0 0 3px #17110c,0 0 0 4px #c9ab6a40,0 14px 36px #000a}
#modal .ledger-figure{border:2px solid var(--brass);border-radius:3px;box-shadow:0 0 0 3px #17110c,0 0 0 4px #c9ab6a40,0 14px 36px #000a}

/* Raised keys: rune keys, seal choices and the maze pad. */
#modal :is(.rune-key,.seal-choice,.maze-key){
 background:linear-gradient(#41331f,#1c150d);border:1px solid var(--brass-mid);border-radius:6px;
 color:var(--brass-hi);text-shadow:0 1px 0 #000a;box-shadow:var(--bevel);
 transition:transform .06s,box-shadow .06s,background .12s;
}
#modal :is(.rune-key,.seal-choice,.maze-key):active{transform:translateY(1px);box-shadow:inset 0 2px 5px #000b}
#modal :is(.rune-key,.seal-choice,.maze-key):focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
#modal .rune-key.illuminated,#modal .heart-node.lit{
 background:radial-gradient(circle at 50% 32%,#ff9aa7,var(--ruby) 58%,#5a1220);color:#fff;border-color:var(--brass-hi);
 box-shadow:0 0 26px #ff738599,inset 0 1px 0 #fff6,inset 0 -3px 6px #3a0a12;text-shadow:0 0 8px #fff8;
}

/* Rune ring: round medallions around a glass heart. */
#modal .heart-ring{border-radius:18px}
#modal .heart-node{
 background:radial-gradient(circle at 35% 28%,#6e5632,#241a0f 72%);border:2px solid var(--brass);color:var(--brass-hi);
 box-shadow:var(--bevel),0 0 0 3px #0c0806;text-shadow:0 1px 0 #000a;
}
#modal .heart-core{color:var(--brass);opacity:1;letter-spacing:2px;text-shadow:0 0 12px #c9ab6a66}

/* Mirror light path: silver beam through brass mirrors, ruby door. */
#modal .light-cell{background:#120d09;border:1px solid #3a2c1a;color:var(--brass-mid);border-radius:2px}
#modal .light-cell.beam{background:linear-gradient(#27303c,#161c25);border-color:#c8d8ec;color:#e6f0ff;box-shadow:inset 0 0 14px #bcd0e866,0 0 8px #bcd0e833}
#modal .light-mirror{background:linear-gradient(#4a3a22,#1d150d);border-color:var(--brass);color:var(--brass-hi);box-shadow:var(--bevel)}
#modal .light-mirror.beam{background:linear-gradient(#5d6c80,#2b3644);border-color:#e6f0ff;color:#fff}
#modal .light-door{border-color:var(--ruby);color:var(--ruby-hi);background:#1a0c10}
#modal .light-door.open{background:radial-gradient(circle,#ff9aa7,var(--ruby));color:#fff;border-color:var(--brass-hi);box-shadow:0 0 20px #ff738599}

/* Embroidery grid: red thread on dark cloth. */
#modal .stitch-cell{background:#120d09;border:1px solid #3a2c1a;color:var(--brass);border-radius:2px}
#modal .stitch-cell.on{background:linear-gradient(#8c2433,#5a1220);border-color:#f0b8c0;color:#fff;box-shadow:inset 0 0 8px #0006}
#modal .stitch-caption{color:var(--brass);letter-spacing:1px}

/* Mirror corridor: mirrored walls, gold traveller. */
#modal .maze-cell{background:#120d09;border:1px solid #3a2c1a;color:var(--brass-mid);border-radius:2px;opacity:1}
#modal .maze-cell.wall{background:linear-gradient(135deg,#6a7a90,#2a3442 55%,#59697e);border-color:#cfdcec;box-shadow:inset 0 0 8px #0008}

<div id="modal"><h2>逆走鐘樓</h2><p class="belfry-note">ABYSS · 星輪 · 原型（規則與介面與遊戲相同）</p><div id="host" class="challenge"></div><p id="proto-done" role="status"></p></div>
<script>
// A time-based animation loop for the belfry mechanisms. requestAnimationFrame stops completely while the page is in the
// background (another tab, a hidden browser pane), which used to freeze a running mechanism. Each frame is therefore
// scheduled twice, by requestAnimationFrame and by a timer, and whichever fires first runs it. Progress is computed from
// the elapsed time, not from the number of frames, so a slow or throttled frame never slows the mechanism down.
// `step(elapsedMs)` returns false when the animation is over. The returned function stops it early.
function animate(step){
 const start=performance.now();
 let stopped=false;
 const frame=()=>{
  if(stopped)return;
  if(step(performance.now()-start)===false){stopped=true;return;}
  schedule();
 };
 function schedule(){
  let fired=false;
  const run=()=>{if(fired)return;fired=true;clearTimeout(timer);frame();};
  const timer=setTimeout(run,document.hidden?50:120);
  requestAnimationFrame(run);
 }
 frame();
 return ()=>{stopped=true;};
}

// Candle-light hints (燭光提示) shared by the three belfry mechanisms. Each mechanism gives `hints`, a map from a step name
// to three tiers - where to look, the rule, the answer - and `currentStep()`, which reads the player's own board and returns
// the step they are stuck on (null once solved). The tier starts again whenever the step changes, so a hint always matches
// the board. After three quiet minutes the mirror lights the first tier by itself.
const hintMarkup='<div class="belfry-hint"><button id="bf-hint" class="secondary-button">燭光提示</button><span id="bf-hint-note" class="belfry-note"></span></div>'
 +'<p id="bf-hint-text" class="belfry-hint-text" role="status" hidden></p>';

function bindHints({hints,currentStep,alive,idleMs=180000}){
 const button=document.getElementById('bf-hint'),box=document.getElementById('bf-hint-text'),note=document.getElementById('bf-hint-note');
 let tier=0,tierStep=null,last=Date.now(),used=0;
 function sync(){
  const step=currentStep();
  if(step!==tierStep){tierStep=step;tier=0;box.hidden=true;note.textContent='';}
  button.hidden=!step;
  if(!step)box.hidden=true;
 }
 function show(auto){
  const step=currentStep();
  if(!step)return;
  if(step!==tierStep){tierStep=step;tier=0;}
  const list=hints[step];
  if(auto){if(tier>0)return;tier=1;}
  else{tier=Math.min(tier+1,list.length);used++;}
  box.hidden=false;
  box.textContent=(auto?'魔鏡低語：':'燭光提示 '+tier+' / '+list.length+'：')+list[tier-1];
  note.textContent=tier<list.length?'再按一次，看更明確的':'這已經是最明確的提示';
 }
 button.onclick=()=>show(false);
 const watch=setInterval(()=>{
  if(!alive()){clearInterval(watch);return;}
  if(Date.now()-last>idleMs&&currentStep()&&tier===0)show(true);
 },Math.min(5000,Math.max(50,idleMs/4)));
 return {
  // Call after every change of the board: the idle timer starts again and the tier follows the board.
  changed(){last=Date.now();sync();},
  show,
  get used(){return used;},
  get tier(){return tier;}
 };
}

// The star wheel (星輪, 鏡淵 E1, third mechanism, opened by the gear train and the pendulum). The rim has 13 notches; the ruby
// sits at notch 0. Notches 1-12 carry the numerals 一 to 十二 in a scrambled order that is only legible by candle light, and
// a hammer strikes the rim once per toll. The hammer moves a fixed number of notches clockwise on every toll, and tolls 一 to
// 十二 must each strike their own numeral; the thirteenth toll then lands on the ruby, which opens the compartment. Because 13
// is prime, the hammer visits every notch once. Only one step size fits the engraving. The rules are pure and checked by search
// in scripts/blood-mirror-abyss.test.mjs; the mount below only draws them.



const NOTCHES=13,RUBY=0,TRUE_STEP=5;
const NUMERALS=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
const inverse=a=>{for(let x=1;x<NOTCHES;x++)if(a*x%NOTCHES===1)return x;return 0;};
// Numeral (1-12) engraved at a notch, or 0 for the ruby: toll n must land where the engraving says n.
const numeralAt=notch=>notch===RUBY?0:inverse(TRUE_STEP)*notch%NOTCHES;
const notchOf=(step,toll)=>step*toll%NOTCHES;
// Plays 13 tolls with a hammer step of `step` notches. `fault` is the first toll that strikes the wrong numeral.
function playTolls(step){
 for(let toll=1;toll<=12;toll++){
  const landed=numeralAt(notchOf(step,toll));
  if(landed!==toll)return {ok:false,fault:{toll,landed,notch:notchOf(step,toll)}};
 }
 return {ok:notchOf(step,13)===RUBY,fault:null};
}
const wheelSolved=step=>playTolls(step).ok;
function solveAll(){const found=[];for(let step=1;step<NOTCHES;step++)if(wheelSolved(step))found.push(step);return found;}

// Candle-light hints, three tiers per step: before the candle was lit, and after.
const HINTS={
 dark:[
  '星輪邊緣刻著字，但在黑暗裡看不見。按「點燭」，用燭光照亮它。',
  '燭光下，每個缺口旁有一個數字，只有紅寶石那一格是空白。撥爪從紅寶石出發，一聲一聲順時針敲下去。',
  '先找到「一」：從紅寶石順時針數到「一」，是第幾格？撥爪每響一聲，就要跨這麼多格。'
 ],
 lit:[
  '第一聲要敲在「一」上，第二聲敲在「二」上，一路到十二，第十三聲回到紅寶石。撥爪每一聲跨的格數是固定的。',
  '從紅寶石順時針數到「一」，那個格數就是撥爪每一聲跨的格數。再檢查：「二」應該在它的兩倍處（超過 13 格就扣掉 13 格）。',
  '「一」在紅寶石順時針第 5 格。把撥爪設為 5，再按「敲鐘」。'
 ]
};
const hintStep=(solvedNow,everLit)=>solvedNow?null:everLit?'lit':'dark';

const NS='http://www.w3.org/2000/svg',CENTER=160,RING=116;
const point=(notch,radius)=>{const angle=notch*Math.PI*2/NOTCHES;return [CENTER+Math.sin(angle)*radius,CENTER-Math.cos(angle)*radius];};
const numeralName=n=>n?NUMERALS[n-1]:'';

// ctx = { render(html), done(), playCue(kind) }
function mountStarWheel(ctx){
 const still=document.body.classList.contains('reduce-motion');
 let lit=false,everLit=false,step=1,running=false,solvedNow=false;
 ctx.render('<div class="belfry">'
  +'<p class="challenge-help">星輪有 13 個缺口，紅寶石在最上面。撥爪每響一聲，就順時針跨過固定的格數，敲在缺口上。<b>讓第一聲到第十二聲，依序敲在刻著「一」到「十二」的缺口上</b>，第十三聲就會落回紅寶石，暗格才會鬆開。</p>'
  +'<ol class="belfry-rules"><li>邊緣的刻字要用燭光才看得見。</li><li>用「−」「＋」設定撥爪每一聲跨幾格，再按「敲鐘」。敲錯不會有懲罰，只會停在出錯的那一聲。</li></ol>'
  +'<p id="bf-status" class="belfry-status" role="status"></p>'
  +'<div class="belfry-board wheel-board"><svg id="bf-svg" class="belfry-svg wheel-svg" viewBox="0 0 320 320" role="img" aria-label="十三格星輪"></svg></div>'
  +'<p id="wheel-engraving" class="wheel-engraving" hidden>刻在輪緣內側：「曲柄十三圈，輪走一圈。擺兩次，鐘響一次。響到第十三聲，暗格才開。」</p>'
  +'<div class="belfry-row"><button id="wheel-candle" class="secondary-button" aria-pressed="false">點燭</button>'
  +'<span class="wheel-step"><button id="wheel-less" class="secondary-button" aria-label="撥爪少跨一格">−</button><output id="wheel-step" class="belfry-note" aria-live="polite"></output><button id="wheel-more" class="secondary-button" aria-label="撥爪多跨一格">＋</button></span></div>'
  +'<button id="bf-run" class="primary-button">敲鐘 ⟶</button>'
  +hintMarkup+'</div>');
 const $=id=>document.getElementById(id),svg=$('bf-svg');
 const alive=()=>svg.isConnected;
 const say=(text,tone='')=>{const el=$('bf-status');el.textContent=text;el.dataset.tone=tone;};
 const hints=bindHints({hints:HINTS,currentStep:()=>hintStep(solvedNow,everLit),alive});

 let body='<circle class="wheel-ring" cx="'+CENTER+'" cy="'+CENTER+'" r="'+RING+'"/><circle class="wheel-hub" cx="'+CENTER+'" cy="'+CENTER+'" r="26"/>';
 for(let notch=0;notch<NOTCHES;notch++){
  const [x1,y1]=point(notch,RING-9),[x2,y2]=point(notch,RING+9),[tx,ty]=point(notch,RING-30);
  body+='<line class="wheel-notch" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>';
  body+=notch===RUBY?'<circle class="wheel-ruby" cx="'+x2.toFixed(1)+'" cy="'+(y2+4).toFixed(1)+'" r="10"/>'
   :'<text class="wheel-glyph" x="'+tx.toFixed(1)+'" y="'+(ty+5).toFixed(1)+'" data-notch="'+notch+'">'+numeralName(numeralAt(notch))+'</text>';
 }
 body+='<line class="wheel-hammer" id="wheel-hammer" x1="'+CENTER+'" y1="'+CENTER+'" x2="'+CENTER+'" y2="'+(CENTER-RING+4)+'"/><circle class="wheel-hammer-head" id="wheel-head" cx="'+CENTER+'" cy="'+(CENTER-RING+4)+'" r="6"/>'
  +'<text class="wheel-toll" id="wheel-toll" x="'+CENTER+'" y="'+(CENTER+9)+'"></text>';
 svg.innerHTML=body;
 const aimHammer=notch=>{
  const [x,y]=point(notch,RING-4),line=$('wheel-hammer'),head=$('wheel-head');
  line.setAttribute('x2',x.toFixed(1));line.setAttribute('y2',y.toFixed(1));head.setAttribute('cx',x.toFixed(1));head.setAttribute('cy',y.toFixed(1));
 };

 function setLight(on){
  lit=on;if(on)everLit=true;
  svg.classList.toggle('lit',on);
  $('wheel-candle').setAttribute('aria-pressed',String(on));
  $('wheel-candle').textContent=on?'熄燭':'點燭';
  $('wheel-engraving').hidden=!on;
  hints.changed();
 }
 function showStep(){$('wheel-step').textContent='撥爪每聲跨 '+step+' 格';$('wheel-less').disabled=running||step<=1;$('wheel-more').disabled=running||step>=NOTCHES-1;}
 $('wheel-candle').onclick=()=>{ctx.playCue('click');setLight(!lit);};
 $('wheel-less').onclick=()=>{step=Math.max(1,step-1);ctx.playCue('click');showStep();};
 $('wheel-more').onclick=()=>{step=Math.min(NOTCHES-1,step+1);ctx.playCue('click');showStep();};

 // One toll every `gap` ms; the hammer jumps `step` notches each time. The result is known up front (playTolls).
 $('bf-run').onclick=()=>{
  if(running)return;
  running=true;showStep();$('bf-run').disabled=true;
  const result=playTolls(step),count=result.ok?13:result.fault.toll,gap=still?160:520;
  say('敲鐘……');
  let shown=0;
  animate(elapsed=>{
   if(!alive())return false;
   const toll=Math.min(count,Math.floor(elapsed/gap)+1);
   if(toll===shown)return;
   shown=toll;
   aimHammer(notchOf(step,toll));ctx.playCue('click');
   $('wheel-toll').textContent=toll<=12?numeralName(toll):'';
   if(toll<count)return;
   setTimeout(()=>{
    if(!alive())return;
    if(result.ok){
     solvedNow=true;ctx.playCue('door');say('第十三聲落在紅寶石上。暗格鬆開了。','ok');hints.changed();
     setTimeout(()=>{if(alive())ctx.done();},still?0:900);
    }else{
     const {toll:wrong,landed}=result.fault;
     say('第 '+wrong+' 聲敲在'+(lit?(landed?'「'+numeralName(landed)+'」':'紅寶石')+'上，應該敲在「'+numeralName(wrong)+'」上。':'錯的缺口上。點燭，看看缺口旁刻著什麼。'),'bad');
     ctx.playCue('wrong');aimHammer(RUBY);$('wheel-toll').textContent='';
     running=false;$('bf-run').disabled=false;showStep();
    }
   },still?0:450);
   return false;
  });
 };

 aimHammer(RUBY);showStep();say('撥爪還在紅寶石上。');hints.changed();
}
