<title>E4 無限鏡廊 原型 v2</title>
<!-- Throwaway prototype (plan-expert-levels.md, E4). v2 after user feedback: v1 used crude SVG shapes and an
     unreadable goal. Now: real game art with obvious landmarks (moons, lantern), a plain-language caption,
     always-on markers, a live guide line, and a gentle snap. Not shipped; not part of the game build. -->
<style>
:root{--bg:#0b0710;--gold:#e0b84f;--red:#b3122b;--ink:#e9dcc3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
header{padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header b{color:var(--gold)}
button{background:#241522;color:var(--ink);border:1px solid var(--gold);border-radius:6px;min-height:44px;padding:0 12px;font:inherit}
#caption{margin:0 12px 6px;padding:8px 12px;border-left:3px solid var(--gold);background:#1a1022;font-size:15px}
#readout{font-variant-numeric:tabular-nums;color:#9fb;font-size:12px;padding:0 12px}
#stage{position:relative;width:100%;height:calc(100% - 190px)}
#board{position:absolute;left:0;top:0;width:744px;height:440px;transform-origin:0 0}
.panel{position:absolute;width:352px;height:200px;border:4px double var(--gold);background:#000;overflow:hidden;cursor:grab;outline-offset:3px}
.panel:focus-visible{outline:2px solid #fff}
.panel.drag{cursor:grabbing;opacity:.72;z-index:20!important}
.layer{position:absolute;left:0;top:0;width:352px;height:200px;transform-origin:0 0;transition:transform .35s}
.layer img{position:absolute;left:0;top:0;width:352px;height:200px;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.tag{position:absolute;left:6px;bottom:4px;font-size:11px;color:#fff;background:#000a;padding:0 6px;border-radius:3px;pointer-events:none}
.mark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none}
.mark.src{border:3px solid var(--gold);box-shadow:0 0 10px var(--gold);animation:pulse 1.4s infinite}
.mark.dst{border:2px dashed #fff;opacity:.85}
.mark.tap{border:3px solid #7fe;animation:pulse 1.4s infinite}
.mark[hidden]{display:none}
@keyframes pulse{50%{transform:scale(1.35);opacity:.55}}
#guide{position:absolute;left:0;top:0;width:744px;height:440px;pointer-events:none;z-index:30}
#done{position:absolute;inset:0;display:none;place-items:center;background:#000a;z-index:40;font-size:22px;text-align:center}
#done.on{display:grid}
@media (prefers-reduced-motion:reduce){.layer,.mark{transition:none;animation:none}}
</style>
</head>

const art={A:'mirror-hall',B:'balcony',C:'black-pine-path',D:'ballroom'};
const names={A:'鏡廳走廊',B:'陽台',C:'黑松林',D:'舞廳'};
// anchor points (panel-local) read off the art: 1664x944 source -> 352x200
const anchors={A:{moonL:[111,77],moonR:[254,78]},B:{moon:[94,30]},C:{lamp:[104,61]}};
const captions=[
 '',
 '① 按住右上的「陽台」畫格，拖到左上的「鏡廊」上，讓陽台的月亮（金圈）對準鏡中的月亮（白色虛線圈）。',
 '② 很好。現在點一下鏡廊裡右邊的鏡子（青色圈），把它放大。',
 '③ 鏡子放大了。按住左下的「黑松林」畫格，拖上去，讓提燈（金圈）對準鏡中的月亮（白色虛線圈）。',
 '完成。'
];

const board=document.getElementById('board'),stage=document.getElementById('stage'),
 readout=document.getElementById('readout'),cap=document.getElementById('caption'),done=document.getElementById('done');
let scale=1,assist=1,beat,zoomed,pos,els={},threads,live=null;

function layout(){
 scale=Math.min(stage.clientWidth/744,stage.clientHeight/440);
 board.style.transform='scale('+scale+')';
 document.getElementById('assist').textContent='容差 '+(assist===1?'4%':'8%')+'（約 '+Math.round(TOL*assist*scale)+' px）';
}
addEventListener('resize',layout);

function build(){
 board.innerHTML='<svg id="guide" viewBox="0 0 744 440"></svg>';els={};
 for(const id of Object.keys(slots)){
  const el=document.createElement('div');
  el.className='panel';el.tabIndex=0;el.setAttribute('role','button');
  el.setAttribute('aria-label','畫格：'+names[id]+'（方向鍵移動，Enter 縮放）');el.dataset.id=id;
  const mk=(cls,[x,y],key)=>`<div class="mark ${cls}" data-mark="${key}" style="left:${x}px;top:${y}px" hidden></div>`;
  let marks='';
  if(id==='A')marks=mk('dst',anchors.A.moonL,'moonL')+mk('dst',anchors.A.moonR,'moonR')+mk('tap',[290,75],'tap');
  if(id==='B')marks=mk('src',anchors.B.moon,'moon');
  if(id==='C')marks=mk('src',anchors.C.lamp,'lamp');
  el.innerHTML=`<div class="layer"><img src="${IMG[art[id]]}" alt="" draggable="false">${marks}</div><span class="tag">${names[id]}</span>`;
  el.style.zIndex=1;board.appendChild(el);els[id]=el;
 }
}
function reset(){
 beat=1;zoomed=false;threads=[];pos={};live=null;
 for(const id in slots)pos[id]=[...slots[id]];
 build();bind();render();done.classList.remove('on');readout.textContent='';
}
const mark=(id,key)=>els[id].querySelector(`[data-mark="${key}"]`);
function render(){
 for(const id in els){
  const el=els[id];el.style.left=pos[id][0]+'px';el.style.top=pos[id][1]+'px';
 }
 const layer=els.A.querySelector('.layer');
 layer.style.transform=zoomed?`translate(${PW/2-ZO[0]*ZOOM}px,${PH/2-ZO[1]*ZOOM}px) scale(${ZOOM})`:'none';
 // markers: only what the current beat needs
 mark('B','moon').hidden=beat!==1;mark('A','moonL').hidden=beat!==1;
 mark('A','tap').hidden=beat!==2;
 mark('C','lamp').hidden=!(beat===3);mark('A','moonR').hidden=!(beat===3&&zoomed);
 cap.textContent=captions[beat];
 drawGuide();
}
function drawGuide(){
 const g=document.getElementById('guide');
 let s=threads.map(([a,b])=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#b3122b" stroke-width="3" stroke-linecap="round"/><circle cx="${a[0]}" cy="${a[1]}" r="4" fill="#b3122b"/><circle cx="${b[0]}" cy="${b[1]}" r="4" fill="#b3122b"/>`).join('');
 if(live){const ok=live.d<=TOL*assist;s+=`<line x1="${live.p[0]}" y1="${live.p[1]}" x2="${live.q[0]}" y2="${live.q[1]}" stroke="${ok?'#6f6':'#fff'}" stroke-width="${ok?3:1.5}" stroke-dasharray="${ok?'0':'5 4'}" opacity=".9"/>`;}
 g.innerHTML=s;
}
function anchorPos(id,name){
 const [ax,ay]=anchors[id][name],[px,py]=pos[id];
 if(id==='A'&&zoomed)return [px+PW/2+(ax-ZO[0])*ZOOM,py+PH/2+(ay-ZO[1])*ZOOM];
 return [px+ax,py+ay];
}
function target(){
 if(beat===1)return {moving:'B',p:()=>anchorPos('B','moon'),q:()=>anchorPos('A','moonL')};
 if(beat===3&&zoomed)return {moving:'C',p:()=>anchorPos('C','lamp'),q:()=>anchorPos('A','moonR')};
 return null;
}
function measure(id){
 const t=target();if(!t||t.moving!==id){live=null;return null;}
 const p=t.p(),q=t.q(),d=Math.hypot(p[0]-q[0],p[1]-q[1]);
 live={p,q,d};readout.textContent='距離 '+d.toFixed(1)+' / 容差 '+(TOL*assist).toFixed(0)+(d<=TOL*assist?'  ✓ 放開就會吸附':'');
 return d;
}
// A gentle snap: within 1.5x the tolerance on release still counts, so a fingertip miss is not punished.
function check(id){
 const t=target();if(!t||t.moving!==id)return false;
 const p=t.p(),q=t.q(),d=Math.hypot(p[0]-q[0],p[1]-q[1]);
 if(d>TOL*assist*1.5)return false;
 pos[id][0]+=q[0]-p[0];pos[id][1]+=q[1]-p[1];live=null;
 if(beat===1){
  threads.push([q,[slots.B[0]+anchors.B.moon[0],slots.B[1]+anchors.B.moon[1]]]);
  beat=2;render();
  setTimeout(()=>{pos.B=[...slots.B];render();},350);
  els.B.style.transition='left .4s,top .4s';setTimeout(()=>els.B.style.transition='',800);
 }else{beat=4;render();setTimeout(()=>done.classList.add('on'),400);}
 return true;
}
function toggleZoom(){
 if(beat<2||beat>3)return;zoomed=!zoomed;
 beat=zoomed?3:2;live=null;render();readout.textContent='';
}

function bind(){
 for(const id in els){
  const el=els[id];let drag=null,moved=false;
  el.addEventListener('pointerdown',e=>{
   if(e.button>0)return;el.setPointerCapture(e.pointerId);
   drag={sx:e.clientX,sy:e.clientY,ox:pos[id][0],oy:pos[id][1]};moved=false;
   Object.values(els).forEach(o=>o.style.zIndex=1);el.style.zIndex=10;
  });
  el.addEventListener('pointermove',e=>{
   if(!drag)return;const dx=(e.clientX-drag.sx)/scale,dy=(e.clientY-drag.sy)/scale;
   if(!moved&&Math.hypot(dx,dy)*scale<6)return;moved=true;el.classList.add('drag');
   pos[id]=[drag.ox+dx,drag.oy+dy];measure(id);render();
  });
  const end=e=>{
   if(!drag)return;const wasMoved=moved;drag=null;el.classList.remove('drag');
   if(!wasMoved){
    if(id==='A'){const r=el.getBoundingClientRect(),lx=(e.clientX-r.left)/scale,ly=(e.clientY-r.top)/scale;
     if(zoomed||(lx>225&&lx<345&&ly>0&&ly<160))toggleZoom();}
    return;
   }
   if(!check(id)){live=null;drawGuide();}
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('keydown',e=>{
   const step=e.shiftKey?2:8,m={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];
   if(m){e.preventDefault();pos[id][0]+=m[0];pos[id][1]+=m[1];measure(id);render();check(id);}
   else if((e.key==='Enter'||e.key==='+'||e.key==='-')&&id==='A'){e.preventDefault();toggleZoom();}
  });
 }
}
document.getElementById('assist').onclick=()=>{assist=assist===1?2:1;layout();};
document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;
layout();reset();
window.__e4={get beat(){return beat},get zoomed(){return zoomed},pos:()=>pos,TOL,scale:()=>scale,els:()=>els,anchorPos,target};
